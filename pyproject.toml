[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vidtight"
version = "0.1.0"
description = "Local screen-recording tightener: parakeet-mlx ASR, filler/pause/retake cuts, vocab fix, EDL + SRT + ffmpeg render."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Very Good Plugins", email = "support@verygoodplugins.com"}
]
keywords = ["video", "screen-recording", "asr", "parakeet", "mlx", "ffmpeg", "srt", "editing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    # Apple Silicon only (MLX). Imported lazily, so the module still imports elsewhere.
    "parakeet-mlx>=0.6.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
]

[project.scripts]
vidtight = "vidtight:main"

[project.urls]
Homepage = "https://github.com/verygoodplugins/vidtight"
Repository = "https://github.com/verygoodplugins/vidtight"
Issues = "https://github.com/verygoodplugins/vidtight/issues"

[tool.setuptools]
py-modules = ["vidtight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 220
target-version = "py311"
extend-exclude = ["runs", "test", "*.v1.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# vidtight.py is intentionally written in a compact style (one-line `if x: y`,
# `a; b` pairs, short lambdas, combined imports). Keep those, lint everything else.
ignore = ["E401", "E701", "E702", "E731", "E741", "I001"]
