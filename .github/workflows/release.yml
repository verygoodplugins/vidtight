# Release workflow
#
# vidtight is a macOS / Apple Silicon CLI that is installed from a clone, so this
# workflow does not publish to PyPI. It checks the tag against the version in
# pyproject.toml, builds the sdist and wheel, and creates a GitHub Release.
#
# How it works:
# 1. Bump `version` in pyproject.toml and move the Unreleased notes in CHANGELOG.md
# 2. Create and push a matching tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Check tag matches pyproject.toml version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version v${version}"
            exit 1
          fi

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          generate_release_notes: true
          files: dist/*
